<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>روضة النجوم</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#dff6ff,#fff4d5);font-family:Tahoma,Arial,sans-serif;text-align:center;color:#284267;min-height:100vh}h1{font-size:clamp(24px,4vw,48px);margin:12px}h2{margin:8px;font-size:clamp(18px,3vw,32px)}main{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px}.kid{mix-blend-mode:multiply;width:13%;max-height:65vh;object-fit:contain}.board{direction:ltr;flex:1;max-width:1050px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.team{direction:rtl;background:color-mix(in srgb,var(--c) 13%,white);border:3px solid var(--c);border-radius:22px;padding:10px 3px;box-shadow:0 5px 0 #0001}.team h3{color:var(--c);font-size:clamp(14px,2.4vw,27px);margin:5px}.score{font-size:32px;font-weight:bold;color:var(--c)}.track{height:130px;background:#edf2f7;border-radius:15px;display:flex;align-items:end;overflow:hidden;margin:8px}.bar{width:100%;background:var(--c);transition:height .35s;height:0}.stars{font-size:20px;line-height:1.4;color:#d2d7df;min-height:60px}.lit{color:#f4b400}button{border:0;border-radius:14px;padding:12px 14px;font:bold 17px Tahoma,Arial;cursor:pointer;color:white;background:var(--c,#7655b5);margin:4px}button:disabled{opacity:.4}#result{font-size:clamp(22px,4vw,45px);font-weight:bold;color:#8b5b00;margin:12px;min-height:45px}.winner{outline:5px solid gold;transform:translateY(-5px)}@media(max-width:650px){main{flex-wrap:wrap}.kid{width:17%;max-height:130px}.board{order:3;flex-basis:100%;gap:4px}.team{padding:5px 1px;border-radius:12px}.team button{padding:8px;font-size:13px}.track{height:85px;margin:4px}.stars{font-size:15px}}.days{display:flex;flex-direction:column;gap:5px}.day{background:white;color:var(--c);border:1px solid var(--c);margin:0;padding:5px 1px;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}.day span{font-size:30px;color:#aab4c3;line-height:1}.day small{font-size:clamp(9px,1.5vw,15px)}.day.on span{color:#e9a900}.day.on{background:#fff4c4}.day:disabled{opacity:1}.score{font-size:25px}@media(min-width:850px){.days{display:grid;grid-template-columns:repeat(5,1fr)}.day small{font-size:10px}} 
#winnerBanner{display:none;max-width:900px;margin:12px auto 4px;padding:14px 18px;background:linear-gradient(135deg,#fff6b7,#ffe082,#fff9d7);border:4px solid #f4b400;border-radius:22px;color:#7a4c00;font-size:clamp(22px,4vw,42px);font-weight:bold;box-shadow:0 8px 24px #0002}
#winnerBanner.show{display:block;animation:pulseWin 1.1s ease-in-out infinite alternate}
@keyframes pulseWin{from{transform:scale(1)}to{transform:scale(1.03)}}
.team.winner{outline:7px solid gold;transform:translateY(-5px) scale(1.03);box-shadow:0 0 0 5px #fff2a8,0 12px 30px #0002}
#celebration{position:fixed;inset:0;background:rgba(20,20,40,.48);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
#celebration.show{display:flex}
.cele-card{position:relative;background:linear-gradient(180deg,#fffbe8,#fff3c2);border:5px solid #f2b705;border-radius:30px;max-width:720px;width:min(92vw,720px);padding:28px 18px 26px;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden}
.cele-card h3{margin:8px 0 10px;font-size:clamp(28px,5vw,50px);color:#8b5b00}
.cele-card p{margin:0;font-size:clamp(24px,4.6vw,46px);font-weight:bold;color:#6b3cb5}
.bigCup{font-size:64px;display:block;animation:bounceCup 1s ease-in-out infinite alternate}
@keyframes bounceCup{from{transform:translateY(0)}to{transform:translateY(-8px) scale(1.06)}}
.fireworks{pointer-events:none;position:absolute;inset:0;overflow:hidden}
.fireworks span{position:absolute;font-size:34px;animation:floatBoom 2.6s ease-in-out infinite;opacity:.92}
.fireworks span:nth-child(1){top:8%;left:8%;animation-delay:0s}
.fireworks span:nth-child(2){top:12%;right:10%;animation-delay:.5s}
.fireworks span:nth-child(3){top:25%;left:18%;animation-delay:1.1s}
.fireworks span:nth-child(4){top:28%;right:18%;animation-delay:.2s}
.fireworks span:nth-child(5){bottom:24%;left:10%;animation-delay:.9s}
.fireworks span:nth-child(6){bottom:19%;right:11%;animation-delay:1.4s}
.fireworks span:nth-child(7){bottom:8%;left:28%;animation-delay:.4s}
.fireworks span:nth-child(8){bottom:7%;right:28%;animation-delay:1.2s}
@keyframes floatBoom{0%{transform:scale(.7) translateY(8px);opacity:.25}40%{transform:scale(1.1) translateY(-6px);opacity:1}100%{transform:scale(.8) translateY(10px);opacity:.35}}
.closeCelebration{background:#7655b5;color:#fff}

ديد</button><button onclick="backup()">حفظ رمز النقاط</button><button onclick="restore()">استرجاع النقاط</button><p id="saved" role="status"></p><div id="result" aria-live="polite"></div>
<div id="winnerBanner" aria-live="polite"></div>
<div id="celebration" aria-hidden="true">
  <div class="cele-card">
    <div class="fireworks">
      <span>🎆</span><span>✨</span><span>🎉</span><span>🎇</span>
      <span>⭐</span><span>🎊</span><span>✨</span><span>🎆</span>
    </div>
    <span class="bigCup">🏆</span>
    <h3>الفصل الفائز</h3>
    <p id="celebrationText"></p>
    <div style="margin-top:16px"><button class="closeCelebration" onclick="hideCelebration()">إغلاق</button></div>
  </div>
</div>
<script>
const names=['1-1','2-1','1-2','2-2','3-2'],key='alnjoom-five-days-v2';
let marks=Array.from({length:5},()=>Array(5).fill(0)),done=false;
function valid(m){return Array.isArray(m)&&m.length===5&&m.every(r=>Array.isArray(r)&&r.length===5&&r.every(v=>v===0||v===1))}
try{let v=JSON.parse(localStorage.getItem(key));if(v&&valid(v.marks)){marks=v.marks;done=!!v.done}}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify({marks,done}));document.getElementById('saved').textContent='✓ النجوم محفوظة على هذا المتصفح';}catch(e){document.getElementById('saved').textContent='الحفظ التلقائي غير متاح؛ احتفظي برمز النقاط قبل الإغلاق.'}}
function scores(){return marks.map(r=>r.reduce((a,b)=>a+b,0))}
function winnerNames(){let a=scores(),max=Math.max(...a);if(max===0)return [];return names.filter((_,i)=>a[i]===max)}
function showCelebration(){let w=winnerNames();if(!w.length)return;document.getElementById('celebrationText').textContent=(w.length>1?'تعادل بين الفصول: ':'مبروك للفصل: ')+w.join(' و ');let c=document.getElementById('celebration');c.classList.add('show');c.setAttribute('aria-hidden','false')}
function hideCelebration(){let c=document.getElementById('celebration');c.classList.remove('show');c.setAttribute('aria-hidden','true')}
function draw(){let a=scores(),max=Math.max(...a);a.forEach((n,i)=>{let t=document.getElementById('t'+i);t.querySelector('.score').textContent=n+' / 5';t.querySelector('.bar').style.height=n*20+'%';t.querySelectorAll('.day').forEach((b,j)=>{let on=!!marks[i][j];b.classList.toggle('on',on);b.querySelector('span').textContent=on?'★':'☆';b.setAttribute('aria-pressed',on);b.disabled=done});t.classList.toggle('winner',done&&n===max&&max>0)});
let w=winnerNames();
document.getElementById('result').textContent=done&&w.length?'🏆 '+(w.length>1?'تعادل الفصول: ':'الفصل الفائز: ')+w.join(' و ')+' 🎉':'';
let banner=document.getElementById('winnerBanner');
if(done&&w.length){banner.textContent=(w.length>1?'🎉 الفصول الفائزة: ':'🎉 الصف الفائز: ')+w.join(' و ')+' 🏆';banner.classList.add('show')}else{banner.textContent='';banner.classList.remove('show')}
}
function toggle(i,j){if(!done){marks[i][j]=1-marks[i][j];save();draw()}}
function finish(){if(!done&&Math.max(...scores())&&confirm('هل حان وقت تكريم الفائز؟')){done=true;save();draw();showCelebration()}}
function resetGame(){if(confirm('هل تريدين تصفير جميع النجوم وبدء أسبوع جديد؟')){marks=Array.from({length:5},()=>Array(5).fill(0));done=false;hideCelebration();save();draw()}}
function backup(){prompt('انسخي الرمز واحفظيه في الملاحظات',marks.map(r=>r.join('')).join('-')+'-'+Number(done))}
function restore(){let v=prompt('أدخلي رمز النجوم المحفوظ');if(v===null)return;if(!/^[01]{5}(?:-[01]{5}){4}-[01]$/.test(v)){alert('الرمز غير صحيح');return}let a=v.split('-');marks=a.slice(0,5).map(r=>r.split('').map(Number));done=a[5]==='1';hideCelebration();save();draw()}
save();draw();
</script><footer style="font-size:20px;font-weight:bold;padding:12px 0 24px">إعداد المعلمة :<br>منيره الهاجري</footer></body></html>
